name: Build APK

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python 3.x
        uses: actions/setup-python@v4
        with:
          python-version: 3.8

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-pip python3-setuptools python3-dev build-essential
          sudo apt-get install -y unzip zip
          sudo apt-get install -y openjdk-8-jdk
          sudo apt-get install -y libffi-dev libssl-dev

      - name: Setup Android SDK
        uses: Swisyn/setup-android-sdk@v1

      - name: Install Python dependencies
        run: |
          python3 -m pip install --upgrade pip
          pip install cython buildozer

      - name: Debug environment
        run: |
          echo $PATH
          which python3
          python3 --version
          which pip
          pip --version
          which buildozer
          buildozer --version || true

      - name: Set up Android SDK and NDK
        run: |
          wget https://dl.google.com/android/repository/android-ndk-r19b-linux-x86_64.zip
          unzip -q android-ndk-r19b-linux-x86_64.zip
          
          wget https://dl.google.com/android/repository/commandlinetools-linux-8512546_latest.zip
          unzip -q commandlinetools-linux-8512546_latest.zip
          
          mkdir -p $HOME/.android/cmdline-tools
          mv cmdline-tools/* $HOME/.android/cmdline-tools/ || true
          
          export ANDROID_SDK_ROOT=$HOME/.android
          export PATH=$ANDROID_SDK_ROOT/cmdline-tools/bin:$PATH
          
          yes | sdkmanager --sdk_root=$ANDROID_SDK_ROOT "platforms;android-29" "build-tools;29.0.3" "tools"

      - name: Set up environment variables
        run: |
          echo "ANDROID_NDK_HOME=$HOME/android-ndk-r19b" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=$HOME/.android" >> $GITHUB_ENV
          echo "ANDROID_HOME=$HOME/.android" >> $GITHUB_ENV

      - name: Build APK with Buildozer
        run: |
          buildozer android debug
